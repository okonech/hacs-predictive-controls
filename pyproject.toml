[project]
name = "hacs-predictive-controls"
version = "0.1.19"
description = "Home Assistant custom integration for Markov-chain predictive controls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "scenario: timestamped acceptance, remediation, restart, or runtime lifecycle scenario",
]
addopts = [
  "--cov=custom_components.predictive_controls",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["custom_components/predictive_controls", "tests"]

[[tool.mypy.overrides]]
module = [
  "custom_components.predictive_controls.__init__",
  "custom_components.predictive_controls.binary_sensor",
  "custom_components.predictive_controls.config_flow",
  "custom_components.predictive_controls.diagnostics",
  "custom_components.predictive_controls.panel",
  "custom_components.predictive_controls.runtime",
  "custom_components.predictive_controls.sensor",
  "custom_components.predictive_controls.storage",
  "custom_components.predictive_controls.websocket",
]
disable_error_code = [
  "call-arg",
  "misc",
  "no-any-return",
  "untyped-decorator",
  "unused-ignore",
]
