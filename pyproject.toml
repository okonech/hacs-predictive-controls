[project]
name = "hacs-predictive-controls"
version = "0.1.10"
description = "Home Assistant custom integration for Markov-chain predictive controls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=custom_components.predictive_controls.markov",
  "--cov=custom_components.predictive_controls.engine",
  "--cov=custom_components.predictive_controls.events",
  "--cov=custom_components.predictive_controls.confidence",
  "--cov=custom_components.predictive_controls.occupancy_graph",
  "--cov=custom_components.predictive_controls.occupancy_dwell",
  "--cov=custom_components.predictive_controls.occupancy_replay",
  "--cov=custom_components.predictive_controls.occupancy_scoring",
  "--cov=custom_components.predictive_controls.occupancy_settings",
  "--cov=custom_components.predictive_controls.occupancy_tracker",
  "--cov=custom_components.predictive_controls.status",
  "--cov=custom_components.predictive_controls.model",
  "--cov=custom_components.predictive_controls.entity_catalog",
  "--cov=custom_components.predictive_controls.actions",
  "--cov=custom_components.predictive_controls.yaml_config",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["custom_components/predictive_controls", "tests"]

[[tool.mypy.overrides]]
module = [
  "custom_components.predictive_controls.__init__",
  "custom_components.predictive_controls.binary_sensor",
  "custom_components.predictive_controls.config_flow",
  "custom_components.predictive_controls.diagnostics",
  "custom_components.predictive_controls.panel",
  "custom_components.predictive_controls.runtime",
  "custom_components.predictive_controls.sensor",
  "custom_components.predictive_controls.websocket",
]
disable_error_code = [
  "call-arg",
  "misc",
  "no-any-return",
  "untyped-decorator",
  "unused-ignore",
]
